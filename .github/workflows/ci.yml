name: CI

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone codetracer-trace-format (Cargo path dependency)
        run: |
          PINS=".github/sibling-pins"
          TF_REF="main"
          if [ -f "${PINS}" ]; then
            PIN="$(grep '^codetracer-trace-format ' "${PINS}" | cut -d' ' -f2)" || true
            [ -n "${PIN}" ] && TF_REF="${PIN}"
          fi
          rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
          if ! git clone --depth 1 --branch "${TF_REF}" --single-branch \
            "https://github.com/metacraft-labs/codetracer-trace-format.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format" 2>/dev/null; then
            rm -rf "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git clone --no-checkout "https://github.com/metacraft-labs/codetracer-trace-format.git" \
              "${GITHUB_WORKSPACE}/../codetracer-trace-format"
            git -C "${GITHUB_WORKSPACE}/../codetracer-trace-format" checkout "${TF_REF}"
          fi

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Nim trace writer library
        run: |
          git clone --depth 1 \
            "https://github.com/metacraft-labs/codetracer-trace-format-nim.git" \
            "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          cd "${GITHUB_WORKSPACE}/../codetracer-trace-format-nim"
          nimble install -y stew results
          nim c --app:staticlib --mm:arc --noMain -d:release -p:src \
            -o:libcodetracer_trace_writer.a src/codetracer_trace_writer_ffi.nim
          echo "CODETRACER_NIM_LIB_DIR=${GITHUB_WORKSPACE}/../codetracer-trace-format-nim" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y capnproto

      - name: Install circom 2.1 (compiler under test)
        # The recorder shells out to `circom` to compile witnesses;
        # the tests in test_ctfs_audit pin against the 2.1 corpus
        # (see CIRCOM_BIN / CIRCOM_2_2_BIN overrides for the 2.2
        # bus-type test).  Fetch the official Linux release binary.
        run: |
          curl -fSL -o /tmp/circom \
            https://github.com/iden3/circom/releases/download/v2.1.9/circom-linux-amd64
          chmod +x /tmp/circom
          sudo mv /tmp/circom /usr/local/bin/circom
          circom --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Run tests with zero-test guard
        run: |
          set -euo pipefail
          OUTPUT=$(cargo test --all-targets 2>&1) || { echo "$OUTPUT"; exit 1; }
          echo "$OUTPUT"
          # Guard against silently empty test suites
          if ! echo "$OUTPUT" | grep -qP "test result: ok\. [1-9]"; then
            echo "::error::Zero tests passed — check that test binaries are compiling correctly"
            exit 1
          fi

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: target/
          retention-days: 7
