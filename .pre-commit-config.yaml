# THE MCL STANDARD HOOK SET (`mcl-standard-hooks`), portable committed form,
# plus this repository's own owning `lint` hook and two checks it already ran.
#
# metacraft-dev-guidelines/policies/repo-requirements.md §4 requires the whole
# set. This file carries all seven members of §4.2 and the per-repo
# `just lint` hook §4.2 asks for beside them:
#
#   committed-binaries tier  check-added-large-files, ban-added-ct-recordings
#   formatting tier          end-of-file-fixer, editorconfig-checker, nixfmt,
#                            terraform-format, prettier
#   owning lint              owning-lint (`just lint`)
#
# It also keeps two checks the flake's git-hooks.nix set has always run here,
# so moving the commit-time rules into this file does not loosen them:
# `check-merge-conflict`, and upstream's default 500 KB
# `check-added-large-files` ceiling (`legacy-added-large-files`), which is
# stricter than the standard set's 1024 KB.
#
# The standard block is devops-modules' `git-hooks/mcl-standard-hooks.yaml`,
# with `rev:` pinned to a devops-modules sha. It is the portable form because
# this repository does not install the set through the devops-modules flake;
# §4.1 is explicit that such a repo's fix is a committed config, not a new
# flake. Membership must match the canonical file exactly: if devops-modules
# adds a hook to the set, add it here too.
#
# THE FLAKE PROVIDES THE TOOLS, THIS FILE PROVIDES THE RULES. Every
# `language: system` hook resolves its executable from PATH, which on
# Linux/macOS is this repository's dev shell (`flake.nix`: prek, uv,
# editorconfig-checker, nixfmt-rfc-style, opentofu, prettier, python3, just,
# plus the Rust toolchain `just lint` drives). On Windows the same tools come
# from winget/scoop/chocolatey.
#
# NO `default_language_version: python: system` HERE, unlike configs written
# for prek alone. The commit-time hook runs the flake's pre-commit (4.3.0),
# which hands `system` to virtualenv as an interpreter name and fails to
# install the two `language: python` hooks ("failed to find interpreter for
# Builtin discover of python_spec='system'"), so every commit would fail.
# Without it both runners build those environments on the dev shell's
# `python3`; prek reports "Venv created successfully with no downloads".
#
# Install:  automatic on dev-shell entry (`nix develop`, direnv):
#           scripts/install-git-hooks.sh, called from the shellHook in
#           flake.nix, points `.git/hooks/pre-commit` -- or, under a
#           Reprobuild dispatcher, its `pre-commit.repro-local` chain -- at
#           this committed config, run by the flake's pre-commit. The
#           Reprobuild dispatchers stay in their slots; repair them with
#           `repro hooks ensure --vcs "$(git rev-parse --show-toplevel)"`.
#           Outside the dev shell: `prek install --install-hooks`, then the
#           same `repro hooks ensure --vcs`, which restores the dispatcher and
#           chains the prek hook as `.git/hooks/pre-commit.repro-local`.
# Run:      prek run --all-files
#
# ON NixOS, `uv` MUST BE ON PATH BEFORE PREK INSTALLS OR RUNS THE HOOKS. prek
# otherwise downloads its own `uv`, which is a generic-linux dynamically linked
# binary and cannot exec on NixOS ("Could not start dynamically linked
# executable"). The hooks then fail to INSTALL, and every commit fails for a
# reason that has nothing to do with its content. The dev shell provides `uv`.
# See repo-requirements.md §4.x.
#
# BOTH COMMITTED-BINARY HOOKS ACT ON ADDED FILES ONLY
# (`git diff --staged --diff-filter=A`), never on files already tracked, so they
# cannot retroactively fail whatever this repository already carries.
# `--enforce-all` is deliberately not passed and must not be added to "tighten"
# it. Measured at 33ac176db (origin/agents), when the committed-binaries tier
# was adopted: 87 tracked files, 0 `*.ct` recordings, 0 over the 1024 KB
# ceiling.
#
# `./flake.nix` also wires a hook set through git-hooks.nix. That set is NOT
# installed on commit; it runs wherever the flake's `checks` output is
# evaluated (`nix flake check`).

minimum_pre_commit_version: "3.0.0"

repos:
  # --- The committed-binaries tier. Mandatory, strict by default. ---------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # 1024 KB, passed explicitly because UPSTREAM'S DEFAULT IS 500 KB. This
      # is a deliberate loosening to the 1 MB the requirements document asks
      # for, not a restatement of the tool's own default -- dropping the
      # argument silently halves the ceiling.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      # This repository's preexisting, stricter 500 KB ceiling (the flake's
      # git-hooks.nix set runs upstream's default). Kept beside the standard
      # member so adopting the set does not raise the limit here.
      - id: check-added-large-files
        alias: legacy-added-large-files
        name: legacy added large files (500 KiB)
        args: ["--maxkb=500"]
        stages: [pre-commit, pre-push, manual]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: end-of-file-fixer

  - repo: https://github.com/metacraft-labs/devops-modules
    # Pinned to a sha, never to a branch: a hook set that changes under a repo
    # without a commit in that repo is a hook set nobody can bisect.
    rev: a7245933b53dc2ade27400f1580333bda58609de
    hooks:
      - id: ban-added-ct-recordings

  # --- Formatting and style. `language: system`, so the tool comes from the
  # --- dev env rather than from a hook environment this file would have to
  # --- pin per OS.
  - repo: local
    hooks:
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: editorconfig-checker
        language: system
        types: [file]

      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

      - id: terraform-format
        name: terraform-format
        description: Format Terraform/OpenTofu HCL files
        entry: tofu fmt
        language: system
        types: [file]
        files: \.(tf|tftest\.hcl)$

      - id: prettier
        name: prettier
        entry: prettier --check --list-different=false --log-level=warn --ignore-unknown --write
        language: system
        types: [text]

      # The repository's own unfiltered lint (repo-requirements.md §4.2: "the
      # repo's own `lint` hook running `just lint`"). Per-repo by nature, so
      # it is not part of the shared set.
      - id: owning-lint
        name: owning unfiltered lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
