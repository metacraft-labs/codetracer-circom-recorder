[package]
name = "codetracer-circom-recorder"
version = "0.1.0"
edition = "2021"
authors = ["Metacraft Labs Ltd"]
description = "CodeTracer recorder for Circom circuit programs"
license = "Apache-2.0"

[[bin]]
name = "codetracer-circom-recorder"
path = "src/main.rs"

[dependencies]
codetracer_trace_types = "0.16"
codetracer_trace_writer = "0.17"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wasmtime = "29"
